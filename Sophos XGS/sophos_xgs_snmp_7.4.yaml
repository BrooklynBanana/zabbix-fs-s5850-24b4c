        - "var s = String(value).replace(/^\\s+|\\s+$/g, '');\nif (/^(|never|perpetual|unlimited|n\\/a|na|not applicable|none|-)$/i.test(s)) return 0;\n\
          var y, m, d, a, order = '{$LICENSE.DATE.ORDER}';\nvar months = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};\n\
          if (a = s.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})$/)) {y=+a[1];m=+a[2];d=+a[3];}\nelse if (a = s.match(/^(\\d{1,2})[ -]([A-Za-z]{3})[ ,\\-]+(\\\
          d{4})$/)) {d=+a[1];m=months[a[2].toLowerCase()];y=+a[3];}\nelse if (a = s.match(/^([A-Za-z]{3})[ -](\\d{1,2})[ ,\\-]+(\\d{4})$/)) {m=months[a[1].toLowerCase()];d=+a[2];y=+a[3];}\n\
          else if (a = s.match(/^(\\d{1,4})[\\/.-](\\d{1,2})[\\/.-](\\d{1,4})$/)) {\n if (order==='YMD') {y=+a[1];m=+a[2];d=+a[3];}\n else if (order==='DMY')\
          \ {d=+a[1];m=+a[2];y=+a[3];}\n else if (order==='MDY') {m=+a[1];d=+a[2];y=+a[3];} else return -1;\n} else return -1;\nif (y<2000 || y>9999 ||\
          \ !m || m>12 || d<1 || d>31) return -1;\nvar dt = new Date(Date.UTC(y,m-1,d));\nif (dt.getUTCFullYear()!==y || dt.getUTCMonth()!==m-1 || dt.getUTCDate()!==d)\
          \ return -1;\nreturn dt.getTime()/1000 + 86399;"
