    discovery_rules:
    - uuid: a168ac09f381488d93af8223cef7d81f
      name: Network interfaces discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      key: net.if.discovery
      delay: 15m
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFNAME}'
          value: '{$IF.NAME.MATCHES}'
          formulaid: A
        - macro: '{#IFNAME}'
          value: '{$IF.NAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      description: Discovers network interfaces
      item_prototypes:
      - uuid: f69eeb2e92964361b4f972282a9a9259
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: net.if.status[{#SNMPINDEX}]
        delay: 1m
        history: 14d
        trends: '0'
        value_type: UNSIGNED
        valuemap:
          name: Interface Operational Status
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: e0966657f17441b79a0f4bf042d76d2c
          expression: '{$IF.MONITOR:"{#IFNAME}"}=1 and nodata(/Sophos XGS by SNMP/net.if.status[{#SNMPINDEX}],{$SNMP.NODATA})=0 and nodata(/Sophos XGS by
            SNMP/net.if.adminstatus[{#SNMPINDEX}],{$SNMP.NODATA})=0 and last(/Sophos XGS by SNMP/net.if.adminstatus[{#SNMPINDEX}])=1 and (last(/Sophos XGS
            by SNMP/net.if.status[{#SNMPINDEX}])=2 or last(/Sophos XGS by SNMP/net.if.status[{#SNMPINDEX}])=6 or last(/Sophos XGS by SNMP/net.if.status[{#SNMPINDEX}])=7)
            and count(/Sophos XGS by SNMP/net.if.status[{#SNMPINDEX}],{$IF.FAIL.WINDOW})>={$IF.FAIL.SAMPLES} and count(/Sophos XGS by SNMP/net.if.status[{#SNMPINDEX}],{$IF.FAIL.WINDOW},"eq","1")=0
            and count(/Sophos XGS by SNMP/net.if.status[{#SNMPINDEX}],{$IF.FAIL.WINDOW},"eq","3")=0 and count(/Sophos XGS by SNMP/net.if.status[{#SNMPINDEX}],{$IF.FAIL.WINDOW},"eq","4")=0
            and count(/Sophos XGS by SNMP/net.if.status[{#SNMPINDEX}],{$IF.FAIL.WINDOW},"eq","5")=0'
          name: 'Interface {#IFNAME}: Link unavailable'
          priority: AVERAGE
          description: Admin up with sustained down/notPresent/lowerLayerDown. Once open, only oper up, admin disabled or monitor disabled resolves it.
          tags:
          - tag: component
            value: interface
          - tag: scope
            value: availability
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: nodata(/Sophos XGS by SNMP/net.if.status[{#SNMPINDEX}],{$SNMP.NODATA})=0 and nodata(/Sophos XGS by SNMP/net.if.adminstatus[{#SNMPINDEX}],{$SNMP.NODATA})=0
            and ({$IF.MONITOR:"{#IFNAME}"}=0 or last(/Sophos XGS by SNMP/net.if.adminstatus[{#SNMPINDEX}])<>1 or last(/Sophos XGS by SNMP/net.if.status[{#SNMPINDEX}])=1)
          dependencies:
          - name: 'Sophos: No SNMP data'
            expression: nodata(/Sophos XGS by SNMP/system.uptime,{$SNMP.NODATA})=1
            recovery_expression: ''
      - uuid: 7443eed9cb164af99eb3a92e867da6e5
