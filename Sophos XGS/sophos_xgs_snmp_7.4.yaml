      description: Enable only after verifying HOST-RESOURCES-MIB hrProcessorLoad is available on this SFOS build. Not present in the supplied Sophos enterprise
        MIB.
      item_prototypes:
      - uuid: 2e100c9da1ac43728238338101ab4307
        name: 'CPU {#SNMPINDEX}: Utilization'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.25.3.3.1.2.{#SNMPINDEX}
        key: sophos.cpu.util[{#SNMPINDEX}]
        delay: 1m
        history: 14d
        trends: 365d
        value_type: UNSIGNED
        tags:
        - tag: component
          value: cpu
        units: '%'
        trigger_prototypes:
        - uuid: 62a79e536c284d8b91db090c2d3666fb
          expression: '{$CPU.MONITOR}=1 and nodata(/Sophos XGS by SNMP/sophos.cpu.util[{#SNMPINDEX}],{$SNMP.NODATA})=0 and avg(/Sophos XGS by SNMP/sophos.cpu.util[{#SNMPINDEX}],5m)>{$CPU.UTIL.WARN}'
          name: 'CPU {#SNMPINDEX}: High utilization'
          priority: WARNING
          description: ''
          tags:
          - tag: component
            value: cpu
          - tag: scope
            value: availability
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: '{$CPU.MONITOR}=0 or (nodata(/Sophos XGS by SNMP/sophos.cpu.util[{#SNMPINDEX}],{$SNMP.NODATA})=0 and avg(/Sophos XGS by SNMP/sophos.cpu.util[{#SNMPINDEX}],5m)<{$CPU.UTIL.WARN}-{$CPU.UTIL.HYST})'
          dependencies:
          - name: 'Sophos: No SNMP data'
            expression: nodata(/Sophos XGS by SNMP/system.uptime,{$SNMP.NODATA})=1
            recovery_expression: ''
    macros:
    - macro: '{$SNMP.NODATA}'
      value: 5m
      description: Freshness timeout; keep longer than the 1m status polling interval.
    - macro: '{$VPN.MONITOR}'
      value: '1'
      description: 'Context: exact VPN name. 1=expect enabled connection to stay up; 0=on-demand/backup tunnel, no state alarms.'
    - macro: '{$VPN.FAIL.WINDOW}'
      value: 3m
      description: Window containing only failed status samples; use at least 3m with 1m polling.
    - macro: '{$VPN.FAIL.SAMPLES}'
      value: '3'
      description: Consecutive 1m connection samples before alarm; integer >=2. 3 samples span about 2m; detection normally 2-3m.
    - macro: '{$IF.MONITOR}'
      value: '1'
      description: 'Context: exact ifName. 0 disables interface alerts but keeps metrics.'
    - macro: '{$IF.NAME.MATCHES}'
      value: .*
      description: Interface discovery include regex.
    - macro: '{$IF.NAME.NOT_MATCHES}'
      value: ^lo$
      description: Interface discovery exclude regex; adjust to your firewall.
    - macro: '{$IF.FAIL.WINDOW}'
      value: 3m
      description: Window containing only failed operational samples; use at least 3m with 1m polling.
    - macro: '{$IF.FAIL.SAMPLES}'
      value: '3'
      description: Consecutive 1m operational samples before link alarm; integer >=2.
    - macro: '{$IF.SPEED.NODATA}'
      value: 15m
      description: Freshness timeout for interface speed polled every 5m.
    - macro: '{$IF.UTIL.WARN}'
      value: '90'
      description: 'Context: ifName. Percent of reported interface speed; zero-speed interfaces excluded.'
    - macro: '{$IF.UTIL.HYST}'
      value: '5'
      description: Percentage points below warning threshold needed for recovery.
    - macro: '{$IF.ERRORS.WARN}'
      value: '1'
      description: 'Context: ifName. Errors per SECOND, averaged over 5m, per direction.'
    - macro: '{$IF.DISCARDS.WARN}'
      value: '1'
      description: 'Context: ifName. Discards per SECOND, averaged over 5m, per direction.'
    - macro: '{$HA.EXPECTED}'
      value: '0'
      description: 1=host must remain an enabled healthy HA pair; 0=standalone permitted. Faulty state still alarms when HA enabled.
    - macro: '{$SERVICE.MONITOR}'
      value: '1'
      description: 'Context: service suffix (e.g. ipsecvpn). 0 disables alert; states 0/7 treated as not configured.'
    - macro: '{$LICENSE.NODATA}'
      value: 3h
      description: License freshness timeout for hourly status/expiry polling.
    - macro: '{$LICENSE.MONITOR}'
      value: '1'
      description: 'Context: license suffix (e.g. network). 0 disables all license alerts for that product.'
    - macro: '{$LICENSE.EXPECTED}'
      value: '0'
      description: 'Context: license suffix. 1 additionally alarms on missing/unsubscribed license; leave 0 for optional products.'
    - macro: '{$LICENSE.WARN.DAYS}'
      value: '30'
      description: License expiry warning lead time.
    - macro: '{$LICENSE.CRIT.DAYS}'
      value: '7'
      description: License expiry critical lead time, <= warning days.
    - macro: '{$LICENSE.DATE.ORDER}'
      value: YMD
      description: 'Numeric date parser: YMD, DMY or MDY. ISO YYYY-MM-DD and English month names also accepted. No automatic guessing.'
    - macro: '{$AP.MONITOR}'
      value: '1'
      description: 'Context: AP name. AP alert switch; discovery disabled initially.'
    - macro: '{$AP.CLIENTS.WARN}'
      value: '50'
      description: AP client warning threshold.
    - macro: '{$CPU.MONITOR}'
      value: '1'
      description: 'CPU alarm switch: 1=monitor average CPU and optional per-core items; 0=no CPU alarms. Polling continues.'
    - macro: '{$CPU.UTIL.HYST}'
      value: '5'
      description: CPU recovery hysteresis in percentage points.
    - macro: '{$CPU.UTIL.WARN}'
      value: '90'
      description: Percent threshold for average CPU and optional per-core CPU monitoring.
    - macro: '{$DISK.UTIL.WARN}'
      value: '85'
      description: Percentage warning threshold, must be below critical.
    - macro: '{$DISK.UTIL.CRIT}'
      value: '95'
      description: Percentage critical threshold.
    - macro: '{$DISK.UTIL.HYST}'
      value: '5'
      description: Recovery hysteresis in percentage points.
    - macro: '{$MEMORY.UTIL.WARN}'
      value: '85'
      description: Percentage warning threshold, must be below critical.
    - macro: '{$MEMORY.UTIL.CRIT}'
      value: '95'
      description: Percentage critical threshold.
    - macro: '{$MEMORY.UTIL.HYST}'
      value: '5'
      description: Recovery hysteresis in percentage points.
    - macro: '{$SWAP.UTIL.WARN}'
      value: '50'
      description: Percentage warning threshold, must be below critical.
    - macro: '{$SWAP.UTIL.CRIT}'
      value: '80'
      description: Percentage critical threshold.
    - macro: '{$SWAP.UTIL.HYST}'
      value: '5'
      description: Recovery hysteresis in percentage points.
    - macro: '{$SERVICE.MONITOR:"pop3"}'
      value: '0'
