    - uuid: 169040229fe94e0984344516ce5d34c8
      name: Disk usage percentage
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.2604.5.1.2.4.2.0
      key: sophos.disk.usage.percentage
      delay: 1m
      history: 14d
      trends: 365d
      units: '%'
      tags:
      - tag: component
        value: storage
      - tag: resource
        value: disk
      triggers:
      - uuid: 82a04d0f52ca49bb8d56cf39b4424cb8
        expression: nodata(/Sophos XGS by SNMP/sophos.disk.usage.percentage,{$SNMP.NODATA})=0 and avg(/Sophos XGS by SNMP/sophos.disk.usage.percentage,5m)>{$DISK.UTIL.CRIT}
        name: 'Sophos: disk utilization high (critical)'
        priority: HIGH
        description: ''
        tags:
        - tag: component
          value: capacity
        - tag: scope
          value: availability
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: nodata(/Sophos XGS by SNMP/sophos.disk.usage.percentage,{$SNMP.NODATA})=0 and avg(/Sophos XGS by SNMP/sophos.disk.usage.percentage,5m)<{$DISK.UTIL.CRIT}-{$DISK.UTIL.HYST}
        dependencies:
        - name: 'Sophos: No SNMP data'
          expression: nodata(/Sophos XGS by SNMP/system.uptime,{$SNMP.NODATA})=1
          recovery_expression: ''
      - uuid: 36dd4ba109704cf8b1687c9a39fc47f4
        expression: nodata(/Sophos XGS by SNMP/sophos.disk.usage.percentage,{$SNMP.NODATA})=0 and avg(/Sophos XGS by SNMP/sophos.disk.usage.percentage,5m)>{$DISK.UTIL.WARN}
        name: 'Sophos: disk utilization high (warning)'
        priority: WARNING
        description: ''
        tags:
        - tag: component
          value: capacity
        - tag: scope
          value: availability
        recovery_mode: RECOVERY_EXPRESSION
