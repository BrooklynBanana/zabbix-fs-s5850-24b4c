zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 729aedd265e146edbb4ce66f651e78ff
    name: Templates/Network devices
  templates:
  - uuid: 543a5987fcd3480dac90963650bd804e
    template: Sophos XGS by SNMP
    name: Sophos XGS by SNMP
    description: Production-oriented candidate 1.0.4 for Zabbix 7.4 and Sophos XG/XGS, SFOS 20+ IPsec table. Numeric OIDs; standalone, no linked templates.
      Configure SNMPv3 AuthPriv at the host interface. Verify firmware MIB/OID availability on your firewall. Based on Ali Erdem Sunar / Pinet and the Zabbix
      community Sophos XG IPsec template. See accompanying README, changelog and test checklist. No credentials included.
    vendor:
      name: DGU community merge
      version: 7.4-1.0.4
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 1da2c9ccb9a344a0910d9259017e2dca
      name: Device name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.2604.5.1.1.1.0
      key: sophos.device.name
      delay: 1h
      history: 14d
      trends: '0'
      value_type: TEXT
      description: Hostname of the SFOS XG Device
      tags:
      - tag: component
        value: system
      - tag: resource
        value: device
    - uuid: 45f435c8f96b47a684ef320db91dd84b
      name: Device type
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.2604.5.1.1.2.0
      key: sophos.device.type
      delay: 1h
      history: 14d
      trends: '0'
      value_type: TEXT
      description: Type of Device like XG-85, XG-210
      inventory_link: MODEL
      tags:
      - tag: component
        value: system
      - tag: resource
        value: device
    - uuid: 3e916d8db21045f58c7b758df98e30d4
      name: Firmware version
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.2604.5.1.1.3.0
      key: sophos.firmware.version
      delay: 1h
      history: 14d
      trends: '0'
      value_type: TEXT
      description: Current running firmware version of SFOS
      inventory_link: OS
      tags:
      - tag: component
        value: system
      - tag: resource
        value: firmware
      triggers:
      - uuid: 67e30de57f3c4c8fb6defe09c50f0ab1
        expression: change(/Sophos XGS by SNMP/sophos.firmware.version)<>0
        name: 'Sophos: Firmware version changed'
        priority: INFO
        description: Informational change event; auto-recovers at next unchanged sample.
        tags:
        - tag: component
          value: system
        - tag: scope
          value: availability
    - uuid: 00f14f14a12f428aa8fe7745d3288c3b
