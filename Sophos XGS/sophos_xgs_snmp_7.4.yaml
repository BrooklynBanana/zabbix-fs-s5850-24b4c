    - uuid: a7c9157f0bb24072a7b68e6b00d5035b
      name: 'CPU: Average utilization'
      type: SNMP_AGENT
      snmp_oid: discovery[{#CPU.UTIL},1.3.6.1.2.1.25.3.3.1.2]
      key: sophos.cpu.util
      delay: 1m
      history: 14d
      trends: 365d
      value_type: FLOAT
      tags:
      - tag: component
        value: cpu
      units: '%'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..['{#CPU.UTIL}'].avg()
      - type: IN_RANGE
        parameters:
        - '0'
        - '100'
      description: Mean of all returned hrProcessorLoad rows, sampled every minute. Each row reports recent processor utilization; this is a percentage
        average, not a sum. Uses the same numeric OID as the official HOST-RESOURCES-MIB CPU SNMP module. Empty or invalid results are unsupported, never
        substituted with zero.
      triggers:
      - uuid: 043f0d25e3944ce087196a15b6b4e1f2
        expression: '{$CPU.MONITOR}=1 and nodata(/Sophos XGS by SNMP/sophos.cpu.util,{$SNMP.NODATA})=1'
        name: 'Sophos: No CPU data'
        priority: WARNING
        description: SNMP remains available but no usable CPU average was received. Check hrProcessorLoad availability and item error; CPU.MONITOR=0 disables
          this alarm.
        tags:
        - tag: component
          value: cpu
        - tag: scope
          value: availability
        dependencies:
        - name: 'Sophos: No SNMP data'
          expression: nodata(/Sophos XGS by SNMP/system.uptime,{$SNMP.NODATA})=1
          recovery_expression: ''
      - uuid: efac06c52015441db9541e503c0a70c8
        expression: '{$CPU.MONITOR}=1 and nodata(/Sophos XGS by SNMP/sophos.cpu.util,{$SNMP.NODATA})=0 and count(/Sophos XGS by SNMP/sophos.cpu.util,5m)>=5
          and min(/Sophos XGS by SNMP/sophos.cpu.util,5m)>{$CPU.UTIL.WARN}'
        name: 'Sophos: High average CPU utilization'
        priority: WARNING
        description: At least five samples in five minutes, all above threshold. Five samples at 1m span about four minutes; typical detection takes four
          to five minutes. Recovery requires a fresh value below the hysteresis threshold.
        tags:
        - tag: component
          value: cpu
        - tag: scope
          value: availability
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: '{$CPU.MONITOR}=0 or (nodata(/Sophos XGS by SNMP/sophos.cpu.util,{$SNMP.NODATA})=0 and last(/Sophos XGS by SNMP/sophos.cpu.util)<{$CPU.UTIL.WARN}-{$CPU.UTIL.HYST})'
        dependencies:
        - name: 'Sophos: No SNMP data'
          expression: nodata(/Sophos XGS by SNMP/system.uptime,{$SNMP.NODATA})=1
          recovery_expression: ''
        - name: 'Sophos: No CPU data'
          expression: '{$CPU.MONITOR}=1 and nodata(/Sophos XGS by SNMP/sophos.cpu.util,{$SNMP.NODATA})=1'
          recovery_expression: ''
