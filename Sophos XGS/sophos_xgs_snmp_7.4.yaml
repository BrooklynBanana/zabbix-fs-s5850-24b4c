    - uuid: f4ae0cc24c05446f89364414b2e93aa1
      name: POP3 service status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.2604.5.1.3.1.0
      key: sophos.service.pop3
      delay: 1m
      history: 14d
      trends: '0'
      value_type: UNSIGNED
      description: POP3 service status
      valuemap:
        name: Sophos Service Status
      tags:
      - tag: component
        value: service
      - tag: service
        value: pop3
      triggers:
      - uuid: fb97914d92f846ee93abb77674b9c649
        expression: '{$SERVICE.MONITOR:"pop3"}=1 and nodata(/Sophos XGS by SNMP/sophos.service.pop3,{$SNMP.NODATA})=0 and count(/Sophos XGS by SNMP/sophos.service.pop3,#3)>=3
          and count(/Sophos XGS by SNMP/sophos.service.pop3,#3,"eq","3")=0 and count(/Sophos XGS by SNMP/sophos.service.pop3,#3,"eq","0")=0 and count(/Sophos
          XGS by SNMP/sophos.service.pop3,#3,"eq","7")=0'
        name: 'Sophos: pop3 service unavailable'
        priority: AVERAGE
        description: Three non-running configured service samples; states 0/7 excluded. Optional service switch by suffix.
        tags:
        - tag: component
          value: service
        - tag: scope
          value: availability
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: nodata(/Sophos XGS by SNMP/sophos.service.pop3,{$SNMP.NODATA})=0 and (last(/Sophos XGS by SNMP/sophos.service.pop3)=3 or last(/Sophos
          XGS by SNMP/sophos.service.pop3)=0 or last(/Sophos XGS by SNMP/sophos.service.pop3)=7 or {$SERVICE.MONITOR:"pop3"}=0)
        dependencies:
        - name: 'Sophos: No SNMP data'
          expression: nodata(/Sophos XGS by SNMP/system.uptime,{$SNMP.NODATA})=1
          recovery_expression: ''
