name: Validate Sophos XGS template
on:
  push:
    paths:
      - 'Sophos XGS/**'
      - '.github/workflows/validate-sophos.yml'
  pull_request:
    paths:
      - 'Sophos XGS/**'
      - '.github/workflows/validate-sophos.yml'
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Run structural and security checks
        run: python 'Sophos XGS/tests/validate.py'
