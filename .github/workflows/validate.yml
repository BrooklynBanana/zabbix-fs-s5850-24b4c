# Zabbix XML and SSH preprocessing regression tests for the FS S5850-24B4C
name: Validate FS S5850-24B4C template
on:
  push:
    paths:
      - 'FS S5850-24B4C/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'FS S5850-24B4C/**'
      - '.github/workflows/validate.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check XML and template structure
        run: python3 'FS S5850-24B4C/tests/validate.py'
      - name: Run SSH parser regression tests
        run: node 'FS S5850-24B4C/tests/test_parser.js'
